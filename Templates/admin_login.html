<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PriceWise - Admin Login</title>

    <link rel="stylesheet" href="/static/admin.css">
</head>

<body>

<div class="admin-login-page">

    <div class="login-card">

        <div class="admin-logo">
            🛍️
        </div>

        <h1>PriceWise</h1>

        <p class="login-subtitle">
            Admin Panel
        </p>

        <div style="
            text-align:center;
            font-size:12px;
            font-weight:700;
            color:#6b7280;
            letter-spacing:1px;
            margin-bottom:25px;
        ">
            ADMINISTRATOR ACCESS
        </div>


        <form id="adminLoginForm" class="login-form">

            <div class="form-group">

                <label for="adminUsername">
                    Username
                </label>

                <input
                    type="text"
                    id="adminUsername"
                    name="username"
                    placeholder="Enter admin username"
                    autocomplete="username"
                    required
                >

            </div>


            <div class="form-group">

                <label for="adminPassword">
                    Password
                </label>

                <div class="password-wrapper">

                    <input
                        type="password"
                        id="adminPassword"
                        name="password"
                        placeholder="Enter admin password"
                        autocomplete="current-password"
                        required
                    >

                    <button
                        type="button"
                        class="password-toggle"
                        id="passwordToggle"
                        aria-label="Show password"
                    >
                        <svg viewBox="0 0 24 24">
                            <path d="M2 12s3.5-8 10-8 10 8 10 8-3.5 8-10 8S2 12 2 12z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                    </button>

                </div>

            </div>


            <button
                type="submit"
                class="login-button"
                id="loginButton"
            >
                Sign In to Admin Panel →
            </button>


            <div
                id="loginMessage"
                class="login-message"
            ></div>

        </form>


        <a
            href="/"
            class="back-home"
        >
            ← Back to PriceWise
        </a>


        <div class="security-note">
            🔒 Authorized administrator access only.
        </div>

    </div>

</div>


<script>

document.addEventListener("DOMContentLoaded", function () {

    const form = document.getElementById("adminLoginForm");
    const usernameInput = document.getElementById("adminUsername");
    const passwordInput = document.getElementById("adminPassword");
    const passwordToggle = document.getElementById("passwordToggle");
    const loginButton = document.getElementById("loginButton");
    const loginMessage = document.getElementById("loginMessage");


    /* ==========================================
       SHOW / HIDE PASSWORD
       ========================================== */

    passwordToggle.addEventListener("click", function () {

        if (passwordInput.type === "password") {

            passwordInput.type = "text";

            passwordToggle.innerHTML = `
                <svg viewBox="0 0 24 24">
                    <path d="M6.1 6.1C3.4 8.1 2 12 2 12s3.5 8 10 8a10.7 10.7 0 0 0 4.1-.8"></path>
                    <path d="M9.9 4.3A10.8 10.8 0 0 1 12 4c7 0 10 8 10 8a17.7 17.7 0 0 1-3.2 4.8"></path>
                    <path d="M10.6 10.6a2 2 0 0 0 2.8 2.8"></path>
                    <path d="M3 3l18 18"></path>
                </svg>
            `;

        } else {

            passwordInput.type = "password";

            passwordToggle.innerHTML = `
                <svg viewBox="0 0 24 24">
                    <path d="M2 12s3.5-8 10-8 10 8 10 8-3.5 8-10 8S2 12 2 12z"></path>
                    <circle cx="12" cy="12" r="3"></circle>
                </svg>
            `;
        }

    });


    /* ==========================================
       ADMIN LOGIN
       ========================================== */

    form.addEventListener("submit", async function (event) {

        event.preventDefault();

        const username = usernameInput.value.trim();
        const password = passwordInput.value;


        if (!username || !password) {

            loginMessage.textContent =
                "Please enter username and password.";

            loginMessage.style.color = "#dc2626";

            return;
        }


        loginButton.disabled = true;
        loginButton.textContent = "Signing in...";

        loginMessage.textContent = "";


        try {

            const response = await fetch(
                "/api/admin/login",
                {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        username: username,
                        password: password
                    })
                }
            );


            const data = await response.json();


            if (response.ok && data.status === "success") {

                loginMessage.textContent =
                    "Login successful. Opening dashboard...";

                loginMessage.style.color = "#16a34a";


                setTimeout(function () {

                    window.location.href = "/admin";

                }, 300);

                return;
            }


            loginMessage.textContent =
                data.message || "Invalid username or password.";

            loginMessage.style.color = "#dc2626";


        } catch (error) {

            console.error("Admin login error:", error);

            loginMessage.textContent =
                "Unable to connect to the server.";

            loginMessage.style.color = "#dc2626";

        }


        loginButton.disabled = false;
        loginButton.textContent =
            "Sign In to Admin Panel →";

    });

});

</script>

</body>
</html>
