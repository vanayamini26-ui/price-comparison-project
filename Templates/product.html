<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>PriceWise - Compare Product</title>

    <link
        rel="stylesheet"
        href="/static/product.css"
    >

</head>


<body>


<!-- ============================================================
     HEADER
============================================================ -->

<header class="product-header">

    <div class="header-inner">

        <a
            href="/products"
            class="brand"
        >

            <div class="brand-icon">
                🛍️
            </div>

            <div>

                <h1>
                    Price<span>Wise</span>
                </h1>

                <p>
                    The Wise Way to Shop
                </p>

            </div>

        </a>


        <a
            href="javascript:history.back()"
            class="back-button"
        >
            ← Back
        </a>

    </div>

</header>



<!-- ============================================================
     MAIN PRODUCT COMPARISON
============================================================ -->

<main class="comparison-page">


    <!-- BACK LINK -->

    <a
        href="javascript:history.back()"
        class="back-link"
    >
        ← Back to Products
    </a>



    <!-- PRODUCT AREA -->

    <section
        id="productContainer"
        class="product-container"
    >

        <div class="loading">

            <div class="loading-icon">
                ⏳
            </div>

            Loading product...

        </div>

    </section>


</main>



<!-- ============================================================
     FOOTER
============================================================ -->

<footer class="footer">

    <div>

        <strong>
            Price<span>Wise</span>
        </strong>

        <p>
            Compare prices. Save money. Shop wise.
        </p>

    </div>


    <a href="/products">
        PriceWise Home
    </a>

</footer>



<!-- PRODUCT ID FROM FLASK -->

<script>

    const productId =
        "{{ product_id }}";

</script>


<script src="/static/product.js"></script>

</body>

</html>
